<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Fleet Weekly Report</title>
</head>
<body>
  <main class="main">
    <header class="header">
      <h3>Fleet Weekly Report</h3>
      <p id="summary-text" class="summary">Loading fleet data…</p>
    </header>

    <section id="stat-tiles" class="stat-tiles" aria-label="Fleet overview"></section>

    <section class="card">
      <h4>Hours logged this month</h4>
      <div id="hours-chart" class="bar-chart"></div>
    </section>

    <section class="card">
      <h4>Harbor map</h4>
      <div id="harbor-map" class="harbor-map"></div>
    </section>
  </main>
  <div id="tooltip" class="viz-tooltip" role="tooltip" hidden></div>
  <script type="module" src="/src/mcp-app.ts"></script>
</body>
</html>
